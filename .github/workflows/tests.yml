name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run when new commits are pushed to the same branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check test naming convention
        run: node .github/scripts/check-test-ids.js

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npx playwright test

      - name: Summarize results and check coverage
        if: ${{ !cancelled() }}
        run: node .github/scripts/test-summary.js

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            test-results/
          retention-days: 30

      # Screenshot baselines written on this run (e.g. a new visual test);
      # download, review and commit them to make them the reference
      - name: Upload new visual baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/**/*-snapshots/
          if-no-files-found: ignore
          retention-days: 30
