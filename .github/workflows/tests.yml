name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# On PRs, a new push cancels the older run on the same branch. Master runs
# get a group of their own: a shared group would let a newer pending run
# replace an older pending one, and that commit would never be tested or
# published.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-{0}', github.ref) || format('tests-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # only to post the results comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check test naming convention
        run: node .github/scripts/check-test-ids.js

      # Downloads system packages from the Ubuntu mirror, which is sometimes
      # very slow. Each attempt gets its own time limit so a slow mirror costs
      # minutes rather than the whole job, then the install is tried again.
      - name: Install Playwright browsers
        timeout-minutes: 14
        run: |
          attempt=0
          for limit in 15s 6m; do
            attempt=$((attempt + 1))
            if timeout --kill-after=30s "$limit" npx playwright install --with-deps; then
              exit 0
            fi
            echo "::warning::Browser install attempt $attempt failed or exceeded $limit"
            # Playwright starts apt-get through sudo, so timeout can't stop it:
            # stop it here, wait for the package lock, and finish any package
            # setup the stopped attempt left half-done
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -x dpkg || true
            for _ in $(seq 60); do
              sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock > /dev/null 2>&1 || break
              sleep 1
            done
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Run tests
        run: npx playwright test

      - name: Summarize results and check coverage
        if: ${{ !cancelled() }}
        run: node .github/scripts/test-summary.js

      # One comment per PR, updated on each run. Skipped for PRs from forks,
      # whose token can't write comments.
      - name: Post results to the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- tests-results-comment -->'
          summary=$(cat reports/summary.md 2>/dev/null || echo '## Test results'$'\n\n''The run did not produce a summary; see the run log.')
          body="$marker"$'\n'"$summary"$'\n\n'"Commit \`${SHA:0:7}\` · [Run details, HTML report and coverage]($RUN_URL#artifacts)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            test-results/
          retention-days: 30

      # Screenshot baselines written on this run (e.g. a new visual test);
      # download, review and commit them to make them the reference
      - name: Upload new visual baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/**/*-snapshots/
          if-no-files-found: ignore
          retention-days: 30

  # Adds this commit's reports to the `test-reports` branch, which holds the
  # history of master reports (see .github/scripts/build-report-site.js).
  publish-reports:
    name: publish reports
    needs: tests
    # Only master commits are published; PR results stay as run artifacts.
    # Runs even when tests fail, since that's when the report matters most.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push to the test-reports branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Missing if the test job failed before uploading; the report page then says so
      - name: Download this run's reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-reports
          path: artifact

      # The branch is replaced by a single commit holding the current reports
      # (the history lives in its folders), so its size stays bounded.
      # Runs for several commits can publish at once: each attempt starts from
      # the latest history, and --force-with-lease only replaces the branch if
      # no other run has pushed since; otherwise it retries.
      - name: Add this commit's report to the history branch
        env:
          SITE_DIR: history
          REPORTS_DIR: artifact/reports
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # expected = the branch's current commit, or empty if it doesn't exist yet
            if git fetch --depth 1 origin test-reports; then
              expected=$(git rev-parse FETCH_HEAD)
              git worktree add --detach history FETCH_HEAD
            else
              expected=""
              git worktree add --orphan -B test-reports history
            fi
            node .github/scripts/build-report-site.js
            git -C history add -A
            commit=$(git -C history commit-tree "$(git -C history write-tree)" -m "Test reports, updated for ${SHA::7}")
            if git push --force-with-lease="refs/heads/test-reports:$expected" origin "$commit:refs/heads/test-reports"; then exit 0; fi
            echo "The history branch changed during publishing; retrying (attempt $attempt)"
            git worktree remove --force history
            sleep $((attempt * 5))
          done
          exit 1

  # Deploys the site: the app from the current tip of master at the root, and
  # the report history under /test-reports/. Built from the latest state rather
  # than this run's commit, so a re-run of an old commit can't put an old app
  # live, and a newer deploy replacing a pending one loses nothing.
  deploy-pages:
    name: deploy pages
    needs: publish-reports
    if: ${{ !cancelled() && needs.publish-reports.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}test-reports/
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Assemble site
        run: |
          git fetch --depth 1 origin test-reports
          mkdir -p _site/test-reports
          git archive HEAD -- . ':!.github' | tar -x -C _site
          git archive FETCH_HEAD | tar -x -C _site/test-reports

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
